.lobby{display:none;border-radius:16px;padding:20px;color:#fff;margin-bottom:18px;font-weight:800;font-size:20px;text-align:center}
body[data-theme="diwali"] .lobby{display:block;background:linear-gradient(90deg,#b45309,#f59e0b,#b45309);background-size:200%;animation:shine 3s linear infinite}
body[data-theme="holi"] .lobby{display:block;background:linear-gradient(90deg,#ec4899,#f59e0b,#22c55e,#3b82f6,#ec4899);background-size:300%;animation:shine 4s linear infinite}
body[data-theme="sale"] .lobby{display:block;background:#dc2626;animation:pulse 1.2s ease-in-out infinite}
@keyframes shine{from{background-position:0 0}to{background-position:200% 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee9f4;flex-wrap:wrap}
.row img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn.danger{background:#dc2626}
.btn.ghost{background:#fff;color:#6d28d9;border:1px solid #ddd0f3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.product-image img{width:100%;height:100%;object-fit:cover}

label{display:block;font-size:13px;font-weight:600;color:#7d7589;margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #ddd6e6;border-radius:10px;font:inherit;margin:4px 0 12px;background:#fff;display:block}
textarea{min-height:90px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;align-items:start}
.form2>*{min-width:0}
form.panel{max-width:100%}
.btn[disabled]{opacity:.55;cursor:wait}
.welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(33,27,46,.88);color:#fff;z-index:200;font-size:26px;font-weight:800;text-align:center;padding:20px;animation:welcomeFade 2.7s ease forwards;pointer-events:none}
@keyframes welcomeFade{0%{opacity:0;transform:scale(.96)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;visibility:hidden}}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fx span{position:absolute;top:-40px;font-size:24px;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}
body[data-theme="diwali"] .lobby{font-size:22px;box-shadow:0 0 24px rgba(245,158,11,.6)}
.brand-logo{width:44px;height:44px;border-radius:12px;object-fit:cover;display:inline-block;flex:0 0 auto}

body{background:#f6f4fb}
.admin-tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(33,27,46,.07);margin-bottom:18px}
.admin-tabs .btn{margin:0;border-radius:999px;padding:9px 16px}
#adminBody .panel{border:none;border-radius:18px;padding:20px;box-shadow:0 3px 14px rgba(33,27,46,.06)}
#adminBody h3{margin:6px 0 12px}
#adminBody .row{border-bottom:1px solid #f1edf7}
.panel input,.panel select,.panel textarea{background:#fbfaff}
input:focus,select:focus,textarea:focus{outline:2px solid #c4b5fd;border-color:#8b5cf6}
.page-title{margin-bottom:14px}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 800, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject; img.src = reader.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

/* ===== Product helpers ===== */
function card(p) {
  const sold = Number(p.stock || 0) <= 0;
  const img = (p.photos || [])[0];
  return `<article class="product-card"><div class="product-image" data-open="${esc(p.id)}">${img ? `<img src="${img}" alt="">` : `<span class="image-placeholder">${EMOJI[p.category] || '🛍️'}</span>`}${Number(p.discount) > 0 ? `<span class="discount-tag">${Number(p.discount)}% OFF</span>` : ''}</div>
    <div class="product-info"><h3>${esc(p.title)}</h3><p>${esc(p.category || '')}${p.sellerName ? ' · ' + esc(p.sellerName) : ''}</p>
    <div class="price-row"><span class="price">${money(priceOf(p))}</span>${Number(p.discount) > 0 ? `<span class="old-price">${money(p.price)}</span>` : ''}</div>
    <div class="card-actions"><button class="btn" data-open="${esc(p.id)}" ${sold ? 'disabled' : ''}>${sold ? 'Out of stock' : 'View / Add'}</button></div></div></article>`;
}

};
function productRow(p) {

    <button class="btn danger" data-del-product="${esc(p.id)}">Delete</button></div>`;
}
function productFormHTML(formId, asSeller) {
  const sellerSel = asSeller ? '' : `<label>Seller<select name="seller"><option value="shop">ShopIndia (apna shop)</option>${sellersCache.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></label>`;
  return `<form class="panel" id="${formId}"><h3>Naya product add karein</h3><div class="form2">

    <label>Category<select name="category">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>

    <label>Description<textarea name="description" rows="3" required></textarea></label>
    <label>Photos (2-3 tak)<input type="file" accept="image/*" multiple></label>
    <button class="btn" type="submit">Product save karein</button></form>`;
}
async function saveProduct(form, asSeller) {
  const fd = new FormData(form);
  const btn = form.querySelector('button[type=submit]');
  const price = Number(fd.get('price'));
  if (!(price > 0)) return alert('Price sahi daalein (1 ya usse zyada)');
  const files = [...form.querySelector('input[type=file]').files].slice(0, 3);
  if (btn) { btn.disabled = true; btn.textContent = 'Save ho raha hai...'; }
  try {
    const photos = [];
    for (const f of files) if (f.type.startsWith('image/')) photos.push(await resizeImage(f));
    let sellerId = 'shop', sellerName = settings.storeName || 'ShopIndia';
    if (asSeller) { sellerId = me.email; sellerName = (sellerProfile && sellerProfile.name) || me.email; }
    else {
      const sel = fd.get('seller') || 'shop';
      if (sel !== 'shop') { const sl = sellersCache.find(x => x.id === sel); sellerId = sel; sellerName = sl ? sl.name : sel; }
    }
    const id = doc(collection(db, 'products')).id;
    await setDoc(doc(db, 'products', id), {
      title: String(fd.get('title')).trim(),
      category: fd.get('category'),
      price,
      discount: Number(fd.get('discount') || 0),
      stock: Number(fd.get('stock') || 0),
      description: String(fd.get('description') || '').trim(),
      sizes: String(fd.get('sizes') || '').split(',').map(x => x.trim()).filter(Boolean),
      photos, sellerId, sellerName, createdAt: Date.now()
    });
    form.reset();
    toast('Product save ho gaya ✅');
  } catch (err) {
    alert('Product save nahi hua: ' + err.message + '\nAgar photo badi hai to 1-2 chhoti photo rakhein.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Product save karein'; }
  }
}

/* ===== Cart ===== */
function addToCart(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const sel = $('#sizeSelect');
  const size = sel ? sel.value : '';
  if ((p.sizes || []).length && !size) { toast('Pehle size chunein'); return; }
  const line = cart.find(x => x.id === id && (x.size || '') === size);
  if ((line ? line.qty : 0) >= Number(p.stock || 0)) { toast('Stock se zyada nahi le sakte'); return; }
  if (line) line.qty++; else cart.push({ id, size, qty: 1 });
  saveLS('si_cart', cart); updateCount(); toast('Cart mein add ho gaya');
}

async function claimUtr(orderId, utr) {
  if (!/^[0-9]{12}$/.test(utr)) { alert('12 digit UTR daalein'); return false; }
  const uid = auth.currentUser ? auth.currentUser.uid : '';
  if (!uid) { alert('Page reload karein, phir UTR daalein'); return false; }
  try {
    const orderSnap = await getDoc(doc(db, 'orders', orderId));
    if (!orderSnap.exists() || orderSnap.data().uid !== uid || orderSnap.data().status !== 'Pending') {
      alert('Is order par UTR submit nahi ho sakta.');
      return false;
    }
    if (orderSnap.data().paymentStatus === 'Claimed' || orderSnap.data().paymentStatus === 'Paid') {
      alert('Is order ka payment status pehle hi update ho chuka hai.');
      return false;
    }
    const batch = writeBatch(db);
    batch.set(doc(db, 'utrs', utr), { orderId, uid, createdAt: Date.now() });
    batch.update(doc(db, 'orders', orderId), { utr, paymentStatus: 'Claimed', claimedAt: Date.now() });
    await batch.commit();
    return true;
  } catch (err) {
    alert('Ye UTR pehle se use ho chuka hai ya galat hai. Sahi UTR daalein.');
    console.warn('UTR claim failed', err.code);
    return false;
  }
}

async function submitUtrFor(orderId, form) {

}

async function submitUtr(form) {

async function placeOrder(form) {
  if (!auth.currentUser) {
    try { await signInAnonymously(auth); }
    catch (err) { alert('Checkout ke liye connection/login zaroori hai: ' + err.message); return; }
  }
  const fd = new FormData(form);
  const lines = [];
  for (const c of cart) {
    const p = products.find(x => x.id === c.id);
    if (!p) continue;
    if (!Number.isInteger(Number(c.qty)) || Number(c.qty) < 1) return alert('Cart quantity sahi nahi hai.');
    if (c.qty > Number(p.stock || 0)) return alert(p.title + ' ka stock kam hai');
    const price = priceOf(p);
    lines.push({ productId: p.id, sellerId: p.sellerId || 'shop', sellerName: p.sellerName || '', title: p.title, size: c.size || '', qty: c.qty, price, lineTotal: price * c.qty });
  }
  if (!lines.length) return alert('Cart mein valid products nahi hain');
  const total = lines.reduce((s, l) => s + l.lineTotal, 0);
  const createdAt = new Date().toISOString();
  const orderRef = doc(collection(db, 'orders'));
  const batch = writeBatch(db);
  batch.set(orderRef, {
    name: String(fd.get('name')).trim(), phone: String(fd.get('phone')).trim(),
    pincode: String(fd.get('pincode')).trim(), address: String(fd.get('address')).trim(),
    lines, total, status: 'Pending', paymentStatus: 'Unpaid', uid: auth.currentUser ? auth.currentUser.uid : '', createdAt
  });
  const buyerUid = auth.currentUser ? auth.currentUser.uid : '';
  lines.forEach(l => batch.set(doc(collection(db, 'sellerOrders')), {
    orderId: orderRef.id, uid: buyerUid, sellerId: l.sellerId,
    title: l.title, size: l.size, qty: l.qty,
    lineTotal: l.lineTotal, status: 'Pending', createdAt, confirmedAt: null, paidAt: null
  }));
  try { await batch.commit(); }
  catch (err) { alert('Order save nahi hua: ' + err.message); return; }
  const short = orderRef.id.slice(-6).toUpperCase();
  myOrders.unshift({ short, total, createdAt, status: 'Pending', items: lines.map(l => ({ title: l.title, size: l.size, qty: l.qty })) });
  saveLS('si_my_orders', myOrders.slice(0, 50));
  cart = []; saveLS('si_cart', cart); updateCount();
  lastOrder = { short, total, fullId: orderRef.id };
  location.hash = '#thanks';
}

async function setOrderStatus(id, status) {
  try {
    await updateDoc(doc(db, 'orders', id), status === 'Confirmed' ? { status, paymentStatus: 'Paid' } : { status });
    const snap = await getDocs(query(collection(db, 'sellerOrders'), where('orderId', '==', id)));
    const batch = writeBatch(db);
    snap.docs.forEach(d => {
      const upd = { status };
      if (status === 'Confirmed' && !d.data().confirmedAt) upd.confirmedAt = Date.now();
      batch.update(d.ref, upd);
    });
    await batch.commit();
    toast('Status update ho gaya');
  } catch (err) { alert(err.message); }
}
async function adminPayoutsHTML() {
  const snap = await getDocs(collection(db, 'sellerOrders'));
  const cutoff = Date.now() - PAYOUT_DAYS * 86400000;
  const groups = {};
  snap.docs.forEach(d => {
    const l = { ref: d.ref, ...d.data() };
    if (l.sellerId === 'shop' || l.paidAt) return;
    if (!['Confirmed', 'Shipped', 'Delivered'].includes(l.status)) return;
    const g = groups[l.sellerId] || (groups[l.sellerId] = { due: [], wait: [] });
    (l.confirmedAt && l.confirmedAt <= cutoff ? g.due : g.wait).push(l);
  });
  payoutCache = groups;
  const ids = Object.keys(groups);
  if (!ids.length) return '<p>Abhi koi payout baaki nahi hai.</p>';
  return ids.map(sid => {
    const g = groups[sid];
    const s = sellersCache.find(x => x.id === sid) || {};
    const c = Number(s.commission ?? DEFAULT_COMMISSION);
    const dueGross = g.due.reduce((a, l) => a + Number(l.lineTotal || 0), 0);
    const dueNet = Math.round(dueGross * (100 - c)) / 100;
    const waitGross = g.wait.reduce((a, l) => a + Number(l.lineTotal || 0), 0);
    return `<div class="panel"><b>${esc(s.name || sid)}</b> <span class="muted">(${esc(sid)}) · commission ${c}%</span>
      <p>${PAYOUT_DAYS} din poore ho chuke: <b>${g.due.length} items</b> · seller ko dena hai <b>${money(dueNet)}</b> (gross ${money(dueGross)})</p>
      <p class="muted">${PAYOUT_DAYS} din se pehle ke: ${g.wait.length} items (${money(waitGross)} gross)</p>
      <button class="btn" data-payout="${esc(sid)}" ${g.due.length ? '' : 'disabled'}>Payout ho gaya (UPI se bhej diya)</button></div>`;
  }).join('');
}
async function markPaid(sid) {
  const g = payoutCache[sid];
  if (!g || !g.due.length) return;
  const s = sellersCache.find(x => x.id === sid) || {};
  const c = Number(s.commission ?? DEFAULT_COMMISSION);
  const gross = g.due.reduce((a, l) => a + Number(l.lineTotal || 0), 0);
  const net = Math.round(gross * (100 - c)) / 100;
  if (!confirm(`${money(net)} seller ko bhej diya hai?`)) return;
  try {
    const batch = writeBatch(db);
    g.due.forEach(l => batch.update(l.ref, { paidAt: Date.now() }));
    await batch.commit();
    await addDoc(collection(db, 'payouts'), { sellerId: sid, count: g.due.length, gross, net, createdAt: Date.now() });
    toast('Payout record save ho gaya');
    loadAdmin();
  } catch (err) { alert(err.message); }
}

    }
  } catch (err) { console.warn('orders load', err); }
  if (list.length) {
    b.innerHTML = list.map(o => `<div class="panel"><b>#${esc(o.id.slice(-6).toUpperCase())}</b> · ${new Date(tn(o.createdAt)).toLocaleString('en-IN')}
      <div class="muted">${(o.lines || []).map(l => `${esc(l.title)}${l.size ? ' (' + esc(l.size) + ')' : ''} × ${l.qty}`).join(', ')}</div>
      <p><b>${money(o.total)}</b> · Status: <b>${esc(o.status)}</b> · Payment: ${esc(o.paymentStatus || 'Unpaid')}${o.utr ? ' · UTR ' + esc(o.utr) : ''}</p>
      ${orderNote(o) ? `<p class="muted"><b>${orderNote(o)}</b></p>` : ''}
      ${(!o.paymentStatus || o.paymentStatus === 'Unpaid') && o.status === 'Pending' ? `<form class="utr-form" data-order="${esc(o.id)}"><label>Payment kiya hai? 12 digit UTR daalein<input name="utr" required pattern="[0-9]{12}" maxlength="12" inputmode="numeric"></label><button class="btn" type="submit">UTR submit karein</button></form>` : ''}
      </div>`).join('');
    return;
  }
  if (!myOrders.length) { b.innerHTML = '<p class="muted">Abhi koi order nahi hai.</p>'; return; }
  b.innerHTML = myOrders.map(o => `<div class="panel"><b>#${esc(o.short)}</b> · ${new Date(o.createdAt).toLocaleString('en-IN')}
    <div class="muted">${o.items.map(i => `${esc(i.title)}${i.size ? ' (' + esc(i.size) + ')' : ''} × ${i.qty}`).join(', ')}</div>
    <p><b>${money(o.total)}</b> · ${esc(o.status)}</p></div>`).join('') + '<p class="muted">Ye orders is device par save hain.</p>';
}

/* ===== Router and render ===== */
function render() {
  const [name, arg] = (location.hash.slice(1) || 'home').split('/');
  document.body.dataset.theme = settings.lobbyTheme || 'none';
  updateCount();
  drawFx();
  const views = {
    home: homeView, products: productsView, product: () => productView(arg), cart: cartView,
    checkout: checkoutView, thanks: thanksView, orders: ordersView, login: loginView,
    admin: adminView, seller: sellerView
  };
  $('#app').innerHTML = (views[name] || homeView)();
  if (name === 'admin' && role === 'admin') loadAdmin();
  if (name === 'seller' && role === 'seller') loadSeller();
  if (name === 'orders') loadMyOrders();
  $('#footer').textContent = `© ${settings.storeName || 'ShopIndia'}${settings.email ? ' · ' + settings.email : ''}`;
}

/* ===== Events ===== */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-add],[data-open],[data-qty],[data-remove],[data-act],[data-tab],[data-thumb],[data-del-product],[data-del-seller],[data-payout]');
  if (!t) return;
  const d = t.dataset;
  if (d.add) { addToCart(d.add); return; }
  if (d.open) { location.hash = '#product/' + d.open; return; }
  if (d.thumb) { const m = $('#mainPhoto'); if (m) m.src = d.thumb; return; }
  if (d.qty !== undefined) {
    const c = cart[Number(d.qty)];
    if (c) {
      const p = products.find(x => x.id === c.id);
      const nq = c.qty + Number(d.d);
      if (nq < 1) return;
      if (p && nq > Number(p.stock || 0)) { toast('Stock se zyada nahi'); return; }
      c.qty = nq; saveLS('si_cart', cart); render();
    }
    return;
  }
  if (d.remove !== undefined) { cart.splice(Number(d.remove), 1); saveLS('si_cart', cart); render(); return; }
  if (d.act === 'logout') { await signOut(auth); location.hash = '#login'; return; }
  if (d.tab) {
    if (location.hash.startsWith('#seller')) sellerTab = d.tab; else adminTab = d.tab;
    render(); return;
  }
  if (d.delProduct && confirm('Ye product delete karein?')) {
    try { await deleteDoc(doc(db, 'products', d.delProduct)); toast('Product delete ho gaya'); }
    catch (err) { alert(err.message); }
    return;
  }
  if (d.delSeller && confirm('Is seller ko hatayein? Wo login nahi kar paayega.')) {
    try { await deleteDoc(doc(db, 'sellers', d.delSeller)); await refreshSellers(); loadAdmin(); }
    catch (err) { alert(err.message); }
    return;
  }
  if (d.payout) { markPaid(d.payout); return; }
});

document.addEventListener('change', e => {
  if (e.target.dataset.ostatus) setOrderStatus(e.target.dataset.ostatus, e.target.value);
});

document.addEventListener('input', e => {
  if (e.target.id === 'q' || e.target.id === 'searchInput') {
    searchQ = e.target.value;
    const pl = $('#plist');
    if (pl) pl.innerHTML = productCards(filtered()) || '<p class="muted">Koi product nahi mila.</p>';
  }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'searchForm') { searchQ = $('#searchInput').value; location.hash = '#products'; render(); return; }
  if (f.id === 'checkoutForm') return placeOrder(f);
  if (f.id === 'utrForm') return submitUtr(f);
  if (f.classList.contains('utr-form')) return submitUtrFor(f.dataset.order, f);
  if (f.id === 'adminProductForm') return saveProduct(f, false).then(() => loadAdmin());
  if (f.id === 'sellerProductForm') return saveProduct(f, true).then(() => loadSeller());
  if (f.id === 'adminSellerForm') {
    const fd = new FormData(f);
    const email = String(fd.get('email')).trim().toLowerCase();
    try {
      await setDoc(doc(db, 'sellers', email), { name: String(fd.get('name')).trim(), email, commission: DEFAULT_COMMISSION, active: true, createdAt: Date.now() });
      f.reset(); toast('Seller add ho gaya'); loadAdmin();
    } catch (err) { alert(err.message); }
    return;
  }
  if (f.id === 'settingsForm') {
    const fd = new FormData(f);
    try {
      await setDoc(doc(db, 'settings', 'store'), {
        storeName: String(fd.get('storeName')).trim(), upiId: String(fd.get('upiId')).trim(),
        phone: String(fd.get('phone')).trim(), email: String(fd.get('email')).trim(),
        lobbyTheme: fd.get('lobbyTheme')
      }, { merge: true });
      toast('Settings save ho gayi');
    } catch (err) { alert(err.message); }
    return;
  }
  if (f.id === 'loginForm') {
    const fd = new FormData(f);
    pendingLogin = true;
    try {
      await signInWithEmailAndPassword(auth, String(fd.get('email')).trim(), String(fd.get('password')));
    } catch (err) {
      pendingLogin = false;
      const el = $('#loginErr'); if (el) el.textContent = 'Email ya password galat hai.';
    }
  }
});


document.addEventListener('click', e => {
  const cat = e.target.closest('[data-cat]');
  if (cat) { searchQ = cat.dataset.cat; location.hash = '#products'; render(); return; }
  if (e.target.closest('#menuButton')) { const mp = $('#menuPanel'); mp.hidden = !mp.hidden; return; }
  if (e.target.closest('#menuPanel a')) { $('#menuPanel').hidden = true; }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-toggle-seller]');
  if (!t) return;
  const id = t.dataset.toggleSeller;
  const active = t.dataset.active !== 'true';
  if (!confirm(active ? 'Seller ko unblock karein?' : 'Seller ko block karein? Wo ab login ya product add nahi kar paayega.')) return;
  try {
    await updateDoc(doc(db, 'sellers', id), { active });
    await refreshSellers();
    loadAdmin();
    toast(active ? 'Seller unblock ho gaya' : 'Seller block ho gaya');
  } catch (err) { alert(err.message); }
});

window.addEventListener('hashchange', render);

/* ===== Live data ===== */
onSnapshot(collection(db, 'products'), snap => {
  products = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort(newest);
  if (!isPanel()) render();
}, err => console.warn('products', err));

onSnapshot(doc(db, 'settings', 'store'), snap => {
  if (snap.exists()) settings = { ...settings, ...snap.data() };
  document.body.dataset.theme = settings.lobbyTheme || 'none';
  if (!isPanel()) render();
}, err => console.warn('settings', err));

onAuthStateChanged(auth, async u => {
  if (!u) {
    me = null; role = null; sellerProfile = null;
    signInAnonymously(auth).catch(err => console.warn('anon', err));
    render();
    return;
  }

  me = u.email ? u : null;
  role = null;
  sellerProfile = null;

  if (u.email) {
    const em = u.email.trim().toLowerCase();
    if (em === ADMIN_EMAIL.toLowerCase()) {
      role = 'admin';
    } else {
      try {
        const sellerSnap = await getDoc(doc(db, 'sellers', em));
        if (sellerSnap.exists() && sellerSnap.data().active === true) {
          role = 'seller';
          sellerProfile = sellerSnap.data();
        }
      } catch (err) {
        console.warn('seller role check failed', err);
      }
    }
  }

  if (pendingLogin) {
    pendingLogin = false;
    if (role === 'admin') {
      showWelcome('🔐 Admin Panel mein swagat');
      location.hash = '#admin';
    } else if (role === 'seller') {
      showWelcome('🧾 Seller Panel mein swagat, ' + esc(sellerProfile.name || me.email));
      location.hash = '#seller';
    } else if (u.email) {
      toast('Ye account active admin ya seller nahi hai');
      await signOut(auth);
    }
  }

  render();
});

render();
</script>
</body>
</html>
